<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta
      name="description"
      content="Красивый общий тирлист фильмов и сериалов по 10-балльной шкале. Синхронизация между устройствами через GitHub."
    />
    <title>Tiers — общий тирлист кино</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html {
        background: #05060a;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #05060a;
        transition: opacity 0.4s ease;
        z-index: 9999;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot div {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.08);
        border-top-color: #f59e0b;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot"><div></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
